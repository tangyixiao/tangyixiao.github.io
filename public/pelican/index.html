<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#bbdeda">
  <meta name="description" content="一只骑着珊瑚色自行车、沿海岸慢慢兜风的鹈鹕。可暂停与调速的原创矢量插画。">
  <title>鹈鹕的海边兜风</title>
  <style>
    :root{color-scheme:light;--sky:#bbdeda;--ink:#254d51;--coral:#df725a;--paper:#fff8df}
    *{box-sizing:border-box}body{margin:0;background:var(--sky);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif}
    .page{max-width:1440px;margin:auto;padding:36px 6vw 20px}header{display:flex;justify-content:space-between;align-items:center;gap:24px}
    .wordmark{font-size:13px;font-weight:600;letter-spacing:.18em;display:flex;align-items:center;gap:12px}.wordmark svg{width:32px;height:24px}
    .lab-back{position:fixed;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));z-index:50;padding:9px 18px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(10,12,18,.72);color:#fff;font-size:13px;font-weight:600;letter-spacing:.05em;text-decoration:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .2s,border-color .2s}.lab-back:hover{background:rgba(10,12,18,.9);border-color:rgba(255,255,255,.4)}.lab-back:focus-visible{outline:3px solid var(--coral);outline-offset:5px}
    .intro{text-align:center;margin:44px 0 -16px;position:relative;z-index:1}.intro p{margin:0 0 14px;font-size:11px;letter-spacing:.28em}.intro h1{font-family:"Palatino Linotype","Songti SC","SimSun",serif;font-weight:500;font-size:clamp(32px,4.2vw,56px);letter-spacing:.06em;margin:0}.intro .subtitle{font-size:13px;letter-spacing:.1em;margin-top:17px}
    figure{margin:0;position:relative}.scene{width:100%;height:auto;display:block;overflow:visible}.cloud{animation:drift 12s ease-in-out infinite alternate}.cloud.second{animation-delay:-5s}.bird-bob{transform-origin:562px 385px}
    .controls{display:flex;align-items:center;justify-content:center;gap:10px;margin:-23px auto 32px;position:relative;z-index:2}button{font:inherit;font-size:12px;border:1px solid #254d5144;border-radius:999px;color:var(--ink);background:#ffffff38;padding:11px 19px;cursor:pointer;display:flex;align-items:center;gap:9px;transition:background .2s,transform .2s}button:hover{background:#fff8df99;transform:translateY(-2px)}button:focus-visible,a:focus-visible{outline:3px solid var(--coral);outline-offset:5px}.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}.primary:hover{background:#35656a}.icon{font-size:12px;width:12px;text-align:center}
    footer{display:flex;justify-content:space-between;gap:16px;font-size:10px;letter-spacing:.12em;border-top:1px solid #254d5125;padding-top:18px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @keyframes drift{from{transform:translateX(-8px)}to{transform:translateX(14px)}}
    @media(max-width:600px){.page{padding:24px 20px 18px}.wordmark{font-size:10px;letter-spacing:.1em}.intro{margin:48px 0 20px}.intro p{font-size:9px}.intro .subtitle{font-size:11px}.scene{width:150%;max-width:none;margin-left:-25%}figure{overflow:hidden}.controls{margin:16px 0 46px}footer{font-size:9px;letter-spacing:.02em}.lab-back{font-size:11px}}
    @media(prefers-reduced-motion:reduce){.cloud{animation:none}button{transition:none}}
  </style>
</head>
<body>
<a class="lab-back" href="/">← 返回主页</a>

          <path d="m503 425-10-28" stroke="#426365" stroke-width="7"/><path d="m688 427-22-63q-4-9 7-12h71" stroke="#426365" stroke-width="7"/><path d="M722 352h24" stroke="#294e50" stroke-width="10"/>

  <figcaption class="sr-only">鹈鹕的海边兜风，一幅可播放和暂停的动态矢量插画。</figcaption>
  </figure>
  <div class="controls"><button class="primary" id="toggle" type="button" aria-pressed="false"><span class="icon" aria-hidden="true">Ⅱ</span><span id="toggle-label">暂停骑行</span></button><button id="speed" type="button"><span aria-hidden="true">↝</span><span id="speed-label">慢慢骑 · 1×</span></button></div>
  <p id="status" class="sr-only" aria-live="polite"></p>
  <footer><span>一只鹈鹕 · 一辆自行车 · 一整个下午</span><span>愿你一路顺风。</span></footer>
</main>
<script>
  const $ = id => document.getElementById(id);
  const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
  let running = !motionPreference.matches, speed = 1, phase = 0, lastTime = null;
  const speeds = [1, 1.6, .65], labels = ['慢慢骑 · 1×', '追上海风 · 1.6×', '悠闲兜风 · 0.65×'];
  function updateButton() {
    $('toggle-label').textContent = running ? '暂停骑行' : '继续骑行';
    $('toggle').querySelector('.icon').textContent = running ? 'Ⅱ' : '▶';
    $('toggle').setAttribute('aria-pressed', String(!running));
    document.querySelectorAll('.cloud').forEach(cloud => cloud.style.animationPlayState = running ? 'running' : 'paused');
  }
  function leg(side, x, y) {
    // A bent two-segment leg follows its pedal, keeping both feet on the crank.
    const hipX = side === 'near' ? 565 : 551, hipY = 380;
    const dx = x - hipX, dy = y - hipY, distance = Math.hypot(dx, dy);
    const thigh = 118, shin = 116;
    const along = (thigh*thigh - shin*shin + distance*distance) / (2*distance);
    const bend = Math.sqrt(Math.max(0, thigh*thigh - along*along));
    const kneeX = hipX + dx*along/distance + dy*bend/distance;
    const kneeY = hipY + dy*along/distance - dx*bend/distance;
    const path = `M${hipX} ${hipY} ${kneeX} ${kneeY} ${x} ${y}`;
    $(side+'-leg').setAttribute('d', path);
    if (side === 'near') $('leg-highlight').setAttribute('d', path);
    $(side+'-foot').setAttribute('transform', `translate(${x} ${y})`);
  }
  function draw() {
    const angle = phase*180/Math.PI;
    $('rear-spokes').setAttribute('transform', `translate(410 553) rotate(${angle*1.7})`);
    $('front-spokes').setAttribute('transform', `translate(762 553) rotate(${angle*1.7})`);
    $('crank').setAttribute('transform', `translate(575 553) rotate(${angle})`);
    leg('near', 575+38*Math.cos(phase), 553+38*Math.sin(phase));
    leg('far', 575-38*Math.cos(phase), 553-38*Math.sin(phase));
    $('breeze').style.opacity = .55+.3*Math.sin(phase);
  }
  function animate(time) {
    if (lastTime !== null && running && !document.hidden) phase += Math.min(time-lastTime, 50)*.0032*speed;
    lastTime = time; draw(); requestAnimationFrame(animate);
  }
  $('toggle').addEventListener('click', () => {running = !running; updateButton(); $('status').textContent = running ? '鹈鹕继续骑行。' : '骑行已暂停。';});
  $('speed').addEventListener('click', () => {speed = speeds[(speeds.indexOf(speed)+1)%speeds.length]; $('speed-label').textContent = labels[speeds.indexOf(speed)]; $('status').textContent = `骑行速度：${speed} 倍。`;});
  motionPreference.addEventListener('change', event => {running = !event.matches; updateButton();});
  document.addEventListener('visibilitychange', () => {lastTime = null;});
  updateButton(); draw(); requestAnimationFrame(animate);
</script>
</body>
</html>
