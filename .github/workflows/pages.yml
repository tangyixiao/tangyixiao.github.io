name: Deploy personal homepage to Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run test:unit
      - run: npm run test:browser
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 死链检查（跳过外链，只查本地相对链接）
        run: npx --yes linkinator ./dist --recurse --markdown --skip "https?://(?!127[.]0[.]0[.]1|localhost)"
      - name: Lighthouse 报告（本轮仅报告，断言只警告不设门槛）
        continue-on-error: true
        run: npx --yes @lhci/cli autorun --collect.staticDistDir=dist --collect.numberOfRuns=1 --collect.settings.throttlingMethod=provided --collect.settings.maxWaitForLoad=90000 --assert.assertions."*"="warn"
      - name: 上传 Lighthouse 报告
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
