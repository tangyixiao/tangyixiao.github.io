<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050507" />
    <meta name="description" content="Adrian Werner Keller — algorithms, mathematics, physics, and AI developer tools." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="canonical" href="https://tangyixiao.github.io/" />
    <!-- Open Graph / Twitter Card：分享卡片元数据 -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tangyixiao.github.io/" />
    <meta property="og:site_name" content="Adrian Werner Keller" />
    <meta property="og:title" content="Adrian Werner Keller · Algorithms, Mathematics & Intelligent Systems" />
    <meta property="og:description" content="Adrian Werner Keller — algorithms, mathematics, physics, and AI developer tools." />
    <meta property="og:image" content="https://tangyixiao.github.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Adrian Werner Keller — Algorithms, Mathematics & Intelligent Systems" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image:alt" content="Adrian Werner Keller — Algorithms, Mathematics & Intelligent Systems" />
    <title>Adrian Werner Keller · Algorithms, Mathematics & Intelligent Systems</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://tangyixiao.github.io/#person",
            "name": "Adrian Werner Keller",
            "url": "https://tangyixiao.github.io/",
            "description": "Software engineer focused on algorithms, mathematics, physics, and AI developer tools.",
            "knowsAbout": ["算法与数据结构", "数学与物理", "AI 与智能体"],
            "sameAs": [
              "https://github.com/tangyixiao"
            ]
          },
          {
            "@type": "WebSite",
            "name": "Adrian Werner Keller",
            "url": "https://tangyixiao.github.io/",
            "inLanguage": ["zh-CN", "en"],
            "publisher": { "@id": "https://tangyixiao.github.io/#person" }
          }
        ]
      }
    </script>
    <script>
      (() => {
        let theme, language
        try { theme = localStorage.getItem('site-theme'); language = localStorage.getItem('site-language') } catch { /* Storage can be disabled. */ }
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if (language !== 'zh' && language !== 'en') language = navigator.language.toLowerCase().startsWith('zh') ? 'zh' : 'en'
        document.documentElement.dataset.theme = theme
        document.documentElement.dataset.language = language
        document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
